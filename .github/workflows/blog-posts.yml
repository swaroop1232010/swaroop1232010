name: Latest Medium articles

on:
  schedule:
    - cron: "30 3 * * *"   # every day, 9:00 AM IST
  workflow_dispatch:       # run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@swaroop1232010"
          max_post_count: 5
          commit_message: "Update latest Medium articles"
